name: CDK Destroy on Branch Close
# stack-deploy / destroy jobs share group cdk-stack-<refs/heads/...> with queue: max.

on:
  pull_request:
    types: [closed]
  delete:

permissions:
  id-token: write # Required for AWS OIDC
  contents: read

jobs:
  destroy:
    name: Destroy Feature Branch Stack
    runs-on: ubuntu-latest
    # Only run for non-main branches
    if: github.event.ref != 'refs/heads/main' && github.event.pull_request.base.ref != 'main'
    concurrency:
      group: cdk-stack-${{ github.event_name == 'delete' && github.ref || format('refs/heads/{0}', github.head_ref) }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main # Checkout main to get CDK code

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: eu-central-1

      - name: Load environment variables
        uses: dmno-dev/varlock-action@v1.0.1

      - name: Determine branch name
        id: branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          DELETE_REF: ${{ github.event.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT_NAME" = "delete" ]; then
            BRANCH="${DELETE_REF#refs/heads/}"
          else
            BRANCH="$PR_HEAD_REF"
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Confirm destroy preconditions
        id: destroy-guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_STATE: ${{ github.event.pull_request.state }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
        run: |
          PROCEED=false
          REASON=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_STATE" = "closed" ]; then
              PROCEED=true
              REASON="Pull request is closed."
            else
              REASON="Pull request is not closed."
            fi
          elif [ "$EVENT_NAME" = "delete" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH_NAME}" >/dev/null 2>&1; then
              REASON="Branch \`${BRANCH_NAME}\` still exists on the remote after waiting for concurrent deploys; skipping destroy."
            else
              PROCEED=true
              REASON="Branch \`${BRANCH_NAME}\` is gone from the remote."
            fi
          fi

          if [ "$PROCEED" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "## Destroy skipped (preconditions)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "${REASON}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for existing branch stacks
        id: stacks
        if: steps.destroy-guard.outputs.proceed == 'true'
        env:
          CDK_ENVIRONMENT: dev
          CDK_BRANCH_OVERWRITE: ${{ steps.branch.outputs.branch }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
        run: |
          SANITIZED=$(vp exec tsx -e '
            import { getSanitizedBranch } from "./utils/git.ts";
            process.stdout.write(getSanitizedBranch());
          ')
          WEBAPP_STACK="WebAppStack-Dev-${SANITIZED}"

          if aws cloudformation describe-stacks --stack-name "$WEBAPP_STACK" >/dev/null 2>&1; then
            echo "stacks_exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "stacks_exist=false" >> "$GITHUB_OUTPUT"
            echo "## Destroy skipped (stacks already gone)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No CloudFormation stack \`${WEBAPP_STACK}\` found for branch \`${BRANCH_NAME}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Destroy CDK Stacks
        if: steps.destroy-guard.outputs.proceed == 'true' && steps.stacks.outputs.stacks_exist == 'true'
        env:
          CDK_ENVIRONMENT: dev
          CDK_BRANCH_OVERWRITE: ${{ steps.branch.outputs.branch }}
          CDK_DESTROY: "true"
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
        run: |
          echo "Destroying all stacks for branch: ${BRANCH_NAME}"
          vp exec cdk destroy --all --force --concurrency 4

      - name: Add destroy summary
        if: steps.destroy-guard.outputs.proceed == 'true' && steps.stacks.outputs.stacks_exist == 'true'
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
        run: |
          echo "## 🗑️ CDK Stacks Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${BRANCH_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | eu-central-1 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All AWS CDK stacks for this branch have been destroyed." >> $GITHUB_STEP_SUMMARY

  comment-on-deployment:
    if: failure()
    needs: destroy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get workflow logs
        id: logs
        run: |
          # Get the last 50 lines of logs which typically contain the error
          LOGS=$(gh run view ${{ github.run_id }} --log | tail -100)
          # Escape newlines and special characters for JSON
          LOGS_ESCAPED=$(echo "$LOGS" | jq -Rs .)
          echo "error_logs=$LOGS_ESCAPED" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on deployment
        uses: actions/github-script@v8
        with:
          script: |
            const workflowUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const logs = ${{ steps.logs.outputs.error_logs }};

            let errorSection = '';
            if (logs && logs.trim()) {
              // Get last 30 lines of logs and truncate if too long
              const logLines = logs.split('\n').slice(-30).join('\n');
              const truncatedLogs = logLines.length > 1500 ? logLines.substring(0, 1500) + '...' : logLines;
              errorSection = `\n\n### 📋 Recent Logs\n\`\`\`\n${truncatedLogs}\n\`\`\``;
            }

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚨 **CDK Destroy Failed**\n\n[View workflow run](${workflowUrl})${errorSection}`
            });
