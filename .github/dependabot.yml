version: 2
updates:
  # Single Bun entry — grouped PRs, no duplicate monthly/weekly configs.
  # Group order matters: first matching group wins (no package in two groups).
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    # Align with bunfig.toml minimumReleaseAge (2 days); security updates bypass cooldown.
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      aws:
        patterns:
          - "@aws-sdk/*"
          - "@aws-lambda-powertools/*"
          - "@smithy/*"
          - "aws-cdk*"
          - "aws-sdk-client-mock"
          - "constructs"
          - "@sentry/aws-serverless"
          - "@types/aws-lambda"
      ui:
        patterns:
          - "@mantine/*"
          - "*mantine*"
          - "*postcss*"
          - "*tanstack*"
          - "*tiptap*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "babel-plugin-react-compiler"
          - "lucide-react"
          - "react-icons"
          - "@sentry/tanstackstart-react"
      platform:
        patterns:
          - "nitro"
          - "better-auth"
          - "electrodb"
          - "varlock"
          - "@varlock/*"
          - "zod"
          - "@middy/*"
          - "dayjs"
          - "num-words-de"
          - "ts-ics"
          - "@behold/*"
      toolchain:
        patterns:
          - "@hey-api/*"
          - "@playwright/*"
          - "@rolldown/*"
          - "@voidzero-dev/*"
          - "esbuild"
          - "tsx"
          - "typescript"
          - "vite"
          - "*vite*"
          - "vite-plus"
          - "@types/*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
